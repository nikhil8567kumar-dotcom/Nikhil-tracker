<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKRISES - System</title>
    <!-- Core App Engines -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; background-color: #0a0a0f;">
    <div id="root"></div>

    <script type="text/babel">
        // Extract hooks directly from global React object for browser execution
        const { useState, useEffect, useRef, useCallback } = React;

        const HABITS = [
          { id: "affirmAM",   text: "🌅 Morning affirmations + visualization" },
          { id: "meditation", text: "🧘 Morning meditation" },
          { id: "workout",    text: "🏋️ Workout + Boxing done" },
          { id: "reading",    text: "📖 Daily reading done" },
          { id: "talk",       text: "💬 Real human interaction" },
          { id: "income",     text: "💰 One income / content action" },
          { id: "affirmPM",   text: "🌙 Night affirmations + visualization" },
        ];

        const RANKS = [
          { rank:"E",   name:"Iron Hunter",      color:"#888888", bg:"rgba(136,136,136,0.08)", min:0,      max:2000   },
          { rank:"D",   name:"Bronze Hunter",    color:"#4fc3f7", bg:"rgba(79,195,247,0.08)",  min:2000,   max:8000   },
          { rank:"C",   name:"Silver Hunter",    color:"#39ff14", bg:"rgba(57,255,20,0.08)",   min:8000,   max:25000  },
          { rank:"B",   name:"Gold Hunter",      color:"#ff9800", bg:"rgba(255,152,0,0.08)",   min:25000,  max:60000  },
          { rank:"A",   name:"Shadow Monarch",   color:"#b388ff", bg:"rgba(179,136,255,0.08)", min:60000,  max:120000 },
          { rank:"S",   name:"S-Rank Hunter",    color:"#ffd600", bg:"rgba(255,214,0,0.08)",   min:120000, max:250000 },
          { rank:"SS",  name:"Absolute",         color:"#ff6ec7", bg:"rgba(255,110,199,0.08)", min:250000, max:500000 },
          { rank:"SSS", name:"The Awakened One", color:"#ff3c3c", bg:"rgba(255,60,60,0.08)",   min:500000, max:999999 },
        ];

        const DAILY_QUESTS = [
          { task:"Film and upload 1 Instagram Reel today",        exp:150 },
          { task:"Write and upload 1 Pocket FM episode",         exp:150 },
          { task:"Write 3 Quora answers today",                  exp:120 },
          { task:"Write 1 new chapter for your next ebook",      exp:150 },
          { task:"Research 5 trending topics for content",       exp:80  },
          { task:"Reply to every comment on your last reel",     exp:70  },
          { task:"Plan next 7 days of content in detail",        exp:100 },
          { task:"Write scripts for your next 3 reels",         exp:120 },
          { task:"Create or update a Gumroad product",          exp:130 },
          { task:"Spend 1 hour studying your analytics",        exp:90  },
          { task:"Find and apply to 1 new affiliate program",   exp:100 },
          { task:"Add 5 new pins to Pinterest today",           exp:70  },
          { task:"Do 100 extra pushups on top of workout",      exp:80  },
          { task:"Train boxing for 30 extra minutes",           exp:80  },
          { task:"Go for a 5KM walk or run outside",            exp:90  },
          { task:"10 minute cold shower today",                 exp:70  },
          { task:"Sleep before 11PM tonight",                   exp:60  },
          { task:"Eat clean all day — zero junk food",          exp:70  },
          { task:"Drink 3 litres of water today",               exp:50  },
          { task:"Do 200 squats throughout the day",            exp:70  },
          { task:"Meditate for 20 extra minutes",               exp:60  },
          { task:"Write in a journal for 15 minutes",           exp:50  },
          { task:"Practice English speaking for 30 minutes",    exp:70  },
          { task:"Watch 1 educational video and take notes",    exp:60  },
          { task:"Write your top 3 goals and why they matter",  exp:50  },
          { task:"Full digital detox for 2 hours",              exp:80  },
          { task:"Call or meet someone who inspires you",       exp:70  },
          { task:"Read 1 chapter of a business book",          exp:70  },
          { task:"Review your weekly progress deeply",          exp:100 },
        ];

        const P1 = ["50 Pushups before midnight","30 min walk outside","1 hour deep work no phone","100 Jumping Jacks","Cold shower today"];
        const P2 = ["100 Pushups before midnight","5KM walk or run today","2 hours deep work no distractions","200 Jumping Jacks + 100 Crunches","Read for 1 hour non-stop"];
        const P3 = ["200 Pushups + 200 Squats before midnight","10KM walk no excuses","4 hours deep work phone away","100 Burpees + 100 Pushups","No social media all day"];
        const P4 = ["300 Pushups + 300 Squats + 5KM run all today","15KM walk no shortcuts","6 hours total deep work phone off","150 Burpees + 150 Pushups + 150 Squats","Full phone detox calls only all day"];

        function todayKey() {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        }
        function getRank(exp) {
          for (let i = RANKS.length-1; i >= 0; i--) if (exp >= RANKS[i].min) return RANKS[i];
          return RANKS[0];
        }
        function getDailyQuest() {
          const seed = todayKey().split("-").reduce((a,b) => a+parseInt(b), 0);
          return DAILY_QUESTS[seed % DAILY_QUESTS.length];
        }
        function formatDate() {
          const n = new Date();
          const days=["SUN","MON","TUE","WED","THU","FRI","SAT"];
          const months=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
          return `${days[n.getDay()]} ${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()}`;
        }
        function rnd(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

        const INIT = {
          totalExp:0, penalties:0,
          pmo:{ days:0, best:0, resets:0 },
          today:{ date:todayKey(), checked:{}, todos:[], note:"", dailyQuestDone:false },
          history:[],
          punishment:null,
        };

        function App() {
          const [s, setS] = useState(INIT);
          const [tab, setTab] = useState("today");
          const [popup, setPopup] = useState(null);
          const [levelUp, setLevelUp] = useState(null);
          const [pmoConfirm, setPmoConfirm] = useState(false);
          const [todoInput, setTodoInput] = useState("");
          const [timer, setTimer] = useState("");
          const ptRef = useRef(null);

          // Handle automatic state syncing with local storage so logs save on page reload
          useEffect(() => {
            const saved = localStorage.getItem('nikrises_system_data');
            if (saved) {
              try { setS(JSON.parse(saved)); } catch(e) {}
            }
          }, []);

          useEffect(() => {
            if (s !== INIT) {
              localStorage.setItem('nikrises_system_data', JSON.stringify(s));
            }
          }, [s]);

          useEffect(() => {
            const tick = () => {
              const now=new Date(), mid=new Date(); mid.setHours(24,0,0,0);
              const d=mid-now, h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), sec=Math.floor((d%60000)/1000);
              setTimer(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`);
            };
            tick(); const id=setInterval(tick,1000); return ()=>clearInterval(id);
          },[]);

          const showPop = useCallback((amt, lbl) => {
            setPopup({amt,lbl}); if(ptRef.current) clearTimeout(ptRef.current);
            ptRef.current=setTimeout(()=>setPopup(null),1800);
          },[]);

          const applyExp = useCallback((amt, lbl, prev) => {
            const prevRank=getRank(prev.totalExp).rank;
            const newExp=Math.max(0,prev.totalExp+amt);
            const newRank=getRank(newExp).rank;
            if(newRank!==prevRank && amt>0) setTimeout(()=>setLevelUp(getRank(newExp)),400);
            showPop(amt,lbl);
            return newExp;
          },[showPop]);

          const toggleHabit = (id) => setS(prev => {
            const was=!!prev.today.checked[id];
            const newExp=applyExp(was?-100:100, was?"-100 EXP":"Habit done! +100 EXP 💪", prev);
            return {...prev, totalExp:newExp, today:{...prev.today, checked:{...prev.today.checked,[id]:!was}}};
          });

          const addTodo = () => {
            if (!todoInput.trim()) return;
            setS(prev=>({...prev, today:{...prev.today, todos:[...(prev.today.todos||[]),{id:Date.now(),text:todoInput.trim(),done:false}]}}));
            setTodoInput("");
          };

          const toggleTodo = (id) => setS(prev => {
            const todos=(prev.today.todos||[]).map(t=>t.id===id?{...t,done:!t.done}:t);
            const was=(prev.today.todos||[]).find(t=>t.id===id)?.done;
            const newExp=applyExp(was?-50:50, was?"-50 EXP":"Quest done! +50 EXP ⚡", prev);
            return {...prev, totalExp:newExp, today:{...prev.today, todos}};
          });

          const deleteTodo = (id) => setS(prev=>({...prev, today:{...prev.today, todos:(prev.today.todos||[]).filter(t=>t.id!==id)}}));

          const completeDailyQuest = () => {
            if (s.today.dailyQuestDone) return;
            const q=getDailyQuest();
            setS(prev=>{
              const newExp=applyExp(q.exp,`System Quest! +${q.exp} EXP ⚡`,prev);
              return {...prev, totalExp:newExp, today:{...prev.today, dailyQuestDone:true}};
            });
          };

          const addPmoDay = () => setS(prev=>{
            const days=(prev.pmo.days||0)+1, best=Math.max(prev.pmo.best||0,days);
            const newExp=applyExp(100,"Clean Day! +100 EXP 🔥",prev);
            return {...prev, totalExp:newExp, pmo:{...prev.pmo,days,best}};
          });

          const confirmRelapse = () => {
            setS(prev=>{
              const cur=prev.pmo.days||0, penalty=cur<5?500:100;
              const msg=cur<5?`-${penalty} EXP — Relapsed early 💀`:`-${penalty} EXP — Rise again 💪`;
              const newExp=applyExp(-penalty,msg,prev);
              const best=Math.max(prev.pmo.best||0,cur);
              return {...prev, totalExp:newExp, pmo:{...prev.pmo,days:0,best,resets:(prev.pmo.resets||0)+1}};
            });
            setPmoConfirm(false);
          };

          const completePunishment = () => setS(prev=>{
            const newExp=applyExp(300,"Punishment Cleared! +300 EXP ⚔️",prev);
            return {...prev, totalExp:newExp, punishment:{...prev.punishment,active:false}};
          });

          const saveDay = () => {
            setS(prev=>{
              const hist=[...( prev.history||[])];
              const idx=hist.findIndex(h=>h.date===prev.today.date);
              if(idx>=0) hist[idx]={...prev.today}; else hist.unshift({...prev.today});
              return {...prev, history:hist};
            });
          };

          const rank=getRank(s.totalExp);
          const nextRank=RANKS[RANKS.indexOf(rank)+1]||rank;
          const expInRank=s.totalExp-rank.min;
          const expNeeded=rank.max-rank.min;
          const pct=Math.min(100,(expInRank/expNeeded)*100);
          const doneCount=HABITS.filter(h=>s.today.checked[h.id]).length;
          const quest=getDailyQuest();

          // STYLES
          const C = {
            app:{ background:"#0a0a0f", minHeight:"100vh", padding:"18px 14px 100px", maxWidth:480, margin:"0 auto", fontFamily:"system-ui,sans-serif", color:"#efefef", boxSizing: "border-box" },
            card:{ background:"#16161e", border:"1px solid #252530", borderRadius:14, padding:"14px 16px", marginBottom:10 },
            surface:{ background:"#111118", border:"1px solid #252530", borderRadius:14, padding:"14px 16px", marginBottom:10 },
            tabBar:{ display:"flex", gap:6, marginBottom:16, overflowX:"auto", paddingBottom:2, scrollbarWidth:"none" },
            tab:(a)=>({ flexShrink:0, padding:"8px 12px", background:a?"rgba(57,255,20,0.12)":"#111118", border:a?"1px solid rgba(57,255,20,0.3)":"1px solid #252530", borderRadius:8, color:a?"#39ff14":"#555", fontSize:9, letterSpacing:"1.5px", textTransform:"uppercase", cursor:"pointer", fontFamily:"monospace", whiteSpace:"nowrap" }),
            habitRow:(d)=>({ display:"flex", alignItems:"center", gap:12, background:d?"rgba(57,255,20,0.04)":"#16161e", border:d?"1px solid rgba(57,255,20,0.2)":"1px solid #252530", borderRadius:12, padding:"13px 14px", marginBottom:8, cursor:"pointer", userSelect:"none" }),
            chk:(d)=>({ width:22, height:22, borderRadius:6, border:d?"2px solid #39ff14":"2px solid #252530", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:12, background:d?"#39ff14":"transparent", color:d?"#000":"transparent", boxShadow:d?"0 0 10px rgba(57,255,20,0.4)":"none" }),
            barBg:{ height:6, background:"#252530", borderRadius:99, overflow:"hidden" },
            bar:(p,c="#39ff14")=>({ height:"100%", borderRadius:99, background:c, width:`${p}%`, transition:"width 0.5s", boxShadow:`0 0 8px ${c}50` }),
            btn:(c="#39ff14")=>({ padding:"12px 16px", background:`${c}20`, border:`1px solid ${c}40`, borderRadius:10, color:c, fontSize:13, fontWeight:800, cursor:"pointer", width:"100%", fontFamily:"system-ui,sans-serif" }),
            seclbl:{ fontFamily:"monospace", fontSize:9, letterSpacing:"2.5px", color:"#555", textTransform:"uppercase", margin:"14px 0 8px 2px" },
            input:{ flex:1, background:"#16161e", border:"1px solid #252530", borderRadius:10, padding:"12px 14px", color:"#efefef", fontFamily:"system-ui,sans-serif", fontSize:13, outline:"none" },
            addbtn:{ background:"#39ff14", border:"none", borderRadius:10, width:44, height:44, fontSize:22, fontWeight:700, color:"#000", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" },
            pill:(d)=>({ fontSize:10, fontWeight:600, padding:"3px 8px", borderRadius:99, fontFamily:"monospace", background:d?"rgba(57,255,20,0.1)":"rgba(255,60,60,0.07)", color:d?"#39ff14":"#ff3c3c", border:d?"1px solid rgba(57,255,20,0.2)":"1px solid rgba(255,60,60,0.18)", marginRight:4, marginBottom:4, display:"inline-block" }),
            mono10:{ fontFamily:"monospace", fontSize:10, color:"#555", letterSpacing:1 },
            g:{ color:"#39ff14" },
            r:{ color:"#ff3c3c" },
            y:{ color:"#ffd600" },
          };

          return (
            <div style={C.app}>

              {/* EXP POPUP */}
              {popup && (
                <div style={{ position:"fixed", top:"50%", left:"50%", transform:"translate(-50%,-50%)", background:"#16161e", border:`2px solid ${popup.amt>0?"#39ff14":"#ff3c3c"}`, borderRadius:20, padding:"20px 28px", textAlign:"center", zIndex:200, boxShadow:`0 0 40px ${popup.amt>0?"rgba(57,255,20,0.3)":"rgba(255,60,60,0.3)"}` }}>
                  <div style={{ fontSize:48, color:popup.amt>0?"#39ff14":"#ff3c3c", lineHeight:1, fontWeight:900 }}>{popup.amt>0?"+":""}{popup.amt}</div>
                  <div style={{ fontFamily:"monospace", fontSize:10, color:"#555", letterSpacing:2, marginTop:4 }}>{popup.lbl}</div>
                </div>
              )}

              {/* LEVEL UP */}
              {levelUp && (
                <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", zIndex:300, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
                  <div style={{ textAlign:"center", padding:30 }}>
                    <div style={{ fontSize:100, color:levelUp.color, textShadow:`0 0 40px ${levelUp.color}`, fontWeight:900 }}>{levelUp.rank}</div>
                    <div style={{ fontSize:28, color:"#efefef", letterSpacing:3, marginTop:8, fontWeight:700 }}>RANK UP!</div>
                    <div style={{ fontFamily:"monospace", fontSize:14, color:levelUp.color, letterSpacing:2, marginTop:6 }}>{levelUp.name}</div>
                    <button onClick={()=>setLevelUp(null)} style={{ marginTop:24, background:levelUp.color, border:"none", borderRadius:12, padding:"14px 32px", fontSize:18, letterSpacing:2, color:"#000", cursor:"pointer", fontWeight:900 }}>ARISE ⚔️</button>
                  </div>
                </div>
              )}

              {/* PMO CONFIRM */}
              {pmoConfirm && (
                <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <div style={{ background:"#16161e", border:"1px solid #252530", borderRadius:18, padding:"24px 20px", width:"88%", maxWidth:340, textAlign:"center" }}>
                    <div style={{ fontSize:22, color:"#ff3c3c", marginBottom:8, fontWeight:900 }}>Reset Streak?</div>
                    <p style={{ fontSize:13, color:"#555", marginBottom:20, lineHeight:1.5 }}>
                      {(s.pmo.days||0)<5?`You're at ${s.pmo.days} days. Costs -500 EXP.`:`You held ${s.pmo.days} days. Costs only -100 EXP. Be honest.`}
                    </p>
                    <div style={{ display:"flex", gap:10 }}>
                      <button onClick={()=>setPmoConfirm(false)} style={{ flex:1, padding:12, borderRadius:10, border:"1px solid #252530", background:"#111118", color:"#efefef", cursor:"pointer", fontSize:14, fontWeight:700 }}>Cancel</button>
                      <button onClick={confirmRelapse} style={{ flex:1, padding:12, borderRadius:10, border:"none", background:"#ff3c3c", color:"#fff", cursor:"pointer", fontSize:14, fontWeight:700 }}>Reset</button>
                    </div>
                  </div>
                </div>
              )}

              {/* HEADER */}
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
                <div>
                  <div style={{ fontSize:38, letterSpacing:2, lineHeight:1, fontWeight:900 }}>NIK<span style={C.g}>RISES</span></div>
                  <div style={C.mono10}>⚡ Solo Leveling System</div>
                </div>
                <div onClick={addPmoDay} style={{ display:"flex", flexDirection:"column", alignItems:"center", background:"#111118", border:"1.5px solid #252530", borderRadius:14, padding:"8px 12px", cursor:"pointer", minWidth:64 }}>
                  <div style={{ fontSize:26, color:"#39ff14", fontWeight:900, lineHeight:1 }}>{s.pmo.days}</div>
                  <div style={{ fontFamily:"monospace", fontSize:7, color:"#555", letterSpacing:1, textTransform:"uppercase", marginTop:2 }}>PMO Free</div>
                  <div style={{ fontSize:9, color:"#39ff14", fontFamily:"monospace", marginTop:3, opacity:0.7 }}>+ Day</div>
                </div>
              </div>

              {/* RANK HERO */}
              <div style={{ background:"#111118", border:`1px solid ${rank.color}40`, borderRadius:16, padding:16, marginBottom:12, position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", inset:0, background:`radial-gradient(ellipse at top left, ${rank.bg} 0%, transparent 60%)`, pointerEvents:"none" }} />
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                  <div style={{ fontSize:56, color:rank.color, textShadow:`0 0 30px ${rank.color}`, lineHeight:1, fontWeight:900 }}>{rank.rank}</div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontSize:18, color:"#efefef", letterSpacing:1, fontWeight:700 }}>{rank.name}</div>
                    <div style={{ fontFamily:"monospace", fontSize:10,or:"pointer", fontFamily:"monospace", whiteSpace:"nowrap" }),
    habitRow:(d)=>({ display:"flex", alignItems:"center", gap:12, background:d?"rgba(57,255,20,0.04)":"#16161e", border:d?"1px solid rgba(57,255,20,0.2)":"1px solid #252530", borderRadius:12, padding:"13px 14px", marginBottom:8, cursor:"pointer", userSelect:"none" }),
    chk:(d)=>({ width:22, height:22, borderRadius:6, border:d?"2px solid #39ff14":"2px solid #252530", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, fontSize:12, background:d?"#39ff14":"transparent", color:d?"#000":"transparent", boxShadow:d?"0 0 10px rgba(57,255,20,0.4)":"none" }),
    barBg:{ height:6, background:"#252530", borderRadius:99, overflow:"hidden" },
    bar:(p,c="#39ff14")=>({ height:"100%", borderRadius:99, background:c, width:`${p}%`, transition:"width 0.5s", boxShadow:`0 0 8px ${c}50` }),
    btn:(c="#39ff14")=>({ padding:"12px 16px", background:`${c}20`, border:`1px solid ${c}40`, borderRadius:10, color:c, fontSize:13, fontWeight:800, cursor:"pointer", width:"100%", fontFamily:"system-ui,sans-serif" }),
    seclbl:{ fontFamily:"monospace", fontSize:9, letterSpacing:"2.5px", color:"#555", textTransform:"uppercase", margin:"14px 0 8px 2px" },
    input:{ flex:1, background:"#16161e", border:"1px solid #252530", borderRadius:10, padding:"12px 14px", color:"#efefef", fontFamily:"system-ui,sans-serif", fontSize:13, outline:"none" },
    addbtn:{ background:"#39ff14", border:"none", borderRadius:10, width:44, height:44, fontSize:22, fontWeight:700, color:"#000", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" },
    pill:(d)=>({ fontSize:10, fontWeight:600, padding:"3px 8px", borderRadius:99, fontFamily:"monospace", background:d?"rgba(57,255,20,0.1)":"rgba(255,60,60,0.07)", color:d?"#39ff14":"#ff3c3c", border:d?"1px solid rgba(57,255,20,0.2)":"1px solid rgba(255,60,60,0.18)", marginRight:4, marginBottom:4, display:"inline-block" }),
    mono10:{ fontFamily:"monospace", fontSize:10, color:"#555", letterSpacing:1 },
    g:{ color:"#39ff14" },
    r:{ color:"#ff3c3c" },
    y:{ color:"#ffd600" },
  };

  return (
    <div style={C.app}>

      {/* EXP POPUP */}
      {popup && (
        <div style={{ position:"fixed", top:"50%", left:"50%", transform:"translate(-50%,-50%)", background:"#16161e", border:`2px solid ${popup.amt>0?"#39ff14":"#ff3c3c"}`, borderRadius:20, padding:"20px 28px", textAlign:"center", zIndex:200, boxShadow:`0 0 40px ${popup.amt>0?"rgba(57,255,20,0.3)":"rgba(255,60,60,0.3)"}` }}>
          <div style={{ fontSize:48, color:popup.amt>0?"#39ff14":"#ff3c3c", lineHeight:1, fontWeight:900 }}>{popup.amt>0?"+":""}{popup.amt}</div>
          <div style={{ fontFamily:"monospace", fontSize:10, color:"#555", letterSpacing:2, marginTop:4 }}>{popup.lbl}</div>
        </div>
      )}

      {/* LEVEL UP */}
      {levelUp && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", zIndex:300, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
          <div style={{ textAlign:"center", padding:30 }}>
            <div style={{ fontSize:100, color:levelUp.color, textShadow:`0 0 40px ${levelUp.color}`, fontWeight:900 }}>{levelUp.rank}</div>
            <div style={{ fontSize:28, color:"#efefef", letterSpacing:3, marginTop:8, fontWeight:700 }}>RANK UP!</div>
            <div style={{ fontFamily:"monospace", fontSize:14, color:levelUp.color, letterSpacing:2, marginTop:6 }}>{levelUp.name}</div>
            <button onClick={()=>setLevelUp(null)} style={{ marginTop:24, background:levelUp.color, border:"none", borderRadius:12, padding:"14px 32px", fontSize:18, letterSpacing:2, color:"#000", cursor:"pointer", fontWeight:900 }}>ARISE ⚔️</button>
          </div>
        </div>
      )}

      {/* PMO CONFIRM */}
      {pmoConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"#16161e", border:"1px solid #252530", borderRadius:18, padding:"24px 20px", width:"88%", maxWidth:340, textAlign:"center" }}>
            <div style={{ fontSize:22, color:"#ff3c3c", marginBottom:8, fontWeight:900 }}>Reset Streak?</div>
